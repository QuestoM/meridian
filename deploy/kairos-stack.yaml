AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Kairos - the complete deployment in one dedicated account. The account IS the
  isolation boundary: data lives on this stack's EFS volume and nowhere else,
  the assistant is deliberately absent (no model key exists here; the AI stays
  on the operator workstation), and handover to the channel is an account
  transfer, not a data migration.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI (with tag) for the Kairos container.
  DesiredCount:
    Type: Number
    Default: 1
  CertificateArn:
    Type: String
    Default: ''
    Description: >-
      ACM certificate for the public hostname. Empty means the demo serves
      plain HTTP; once set, the stack adds an HTTPS listener and turns the
      HTTP listener into a 301 redirect, so real credentials never cross
      port 80 again.

  AssistantKeySecretArn:
    Type: String
    Default: ''
    Description: >-
      Secrets Manager ARN holding Kai's model key. Empty means the assistant is
      absent from the cloud (its original state); set, the key is injected as
      ANTHROPIC_API_KEY and Kai answers for every signed-in account on the
      operator's own model subscription. OWNER DECISION 2026-08-24: the demo
      runs Kai in the cloud on the operator's key; per-user authority is
      unchanged (Kai holds exactly the signed-in user's permissions).

  AssistantBridgeSecretArn:
    Type: String
    Default: ''
    Description: >-
      Secrets Manager ARN of the subscription bridge: the operator's machine
      pushes its live short-lived Claude access token there, and the task
      reads it at call time so Kai answers on the operator's own plan instead
      of console credit. The refresh token never leaves the machine; when the
      machine stops pushing, the token ages out and the assistant reports the
      truth. Empty means no bridge.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasAssistantKey: !Not [!Equals [!Ref AssistantKeySecretArn, '']]
  HasBridgeSecret: !Not [!Equals [!Ref AssistantBridgeSecretArn, '']]

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: kairos }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.16.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable }
  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable }

  # ------------------------------------------------------------- security
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kairos ALB - the only public doorway.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kairos tasks - reachable from the ALB alone.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kairos EFS - reachable from the tasks alone.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  # ------------------------------------------------------------------ state
  # The one thing every deploy must outlive. Encrypted at rest with the
  # account's own key, so leaving the organization takes the data's keys along.
  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    Properties:
      Encrypted: true
      FileSystemTags: [{ Key: Name, Value: kairos-state }]
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref SubnetA
      SecurityGroups: [!Ref EfsSecurityGroup]
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref SubnetB
      SecurityGroups: [!Ref EfsSecurityGroup]
  AccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: { Uid: '0', Gid: '0' }
      RootDirectory:
        Path: /kairos-state
        CreationInfo: { OwnerUid: '0', OwnerGid: '0', Permissions: '0755' }

  # ---------------------------------------------------------------- secrets
  # The first administrator's password. Generated by AWS inside the account,
  # injected into the task at boot, readable by the operator from the console
  # or CLI. It exists in no image, no repository and no shell history.
  AdminPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: kairos/admin-password
      GenerateSecretString:
        PasswordLength: 24
        ExcludeCharacters: "\"'@/\\`"

  # ---------------------------------------------------------------- compute
  Cluster:
    Type: AWS::ECS::Cluster
    Properties: { ClusterName: kairos }
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /kairos/app, RetentionInDays: 30 }
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-admin-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasAssistantKey
                  - [!Ref AdminPassword, !Ref AssistantKeySecretArn]
                  - [!Ref AdminPassword]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exec-into-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'
        - !If
          - HasBridgeSecret
          - PolicyName: read-subscription-bridge
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref AssistantBridgeSecretArn
          - !Ref AWS::NoValue
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kairos
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: state
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig: { AccessPointId: !Ref AccessPoint, IAM: DISABLED }
      ContainerDefinitions:
        - Name: kairos
          Image: !Ref ImageUri
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          MountPoints: [{ SourceVolume: state, ContainerPath: /app/state }]
          Environment:
            # Both exist only in the TLS deployment: the session cookie takes
            # the Secure flag (the app's own KAIROS_COOKIE_SECURE switch, built
            # for exactly this), and the proxy adds a year of HSTS.
            - !If
              - HasCertificate
              - { Name: KAIROS_COOKIE_SECURE, Value: '1' }
              - !Ref AWS::NoValue
            - !If
              - HasCertificate
              - { Name: KAIROS_TLS, Value: '1' }
              - !Ref AWS::NoValue
            # The bridge is an ARN the app READS AT CALL TIME, deliberately not
            # an ECS Secret: those inject once at task start, and this token
            # changes every few minutes.
            - !If
              - HasBridgeSecret
              - { Name: KAIROS_ASSISTANT_BRIDGE_SECRET_ARN, Value: !Ref AssistantBridgeSecretArn }
              - !Ref AWS::NoValue
          Secrets:
            - { Name: KAIROS_ADMIN_PASSWORD, ValueFrom: !Ref AdminPassword }
            # Kai's key, present only once the operator has loaded the secret.
            # The key exists in the account's own vault and in the task's
            # environment - never in an image, the repository, or a transcript.
            - !If
              - HasAssistantKey
              - { Name: ANTHROPIC_API_KEY, ValueFrom: !Ref AssistantKeySecretArn }
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: kairos
  Service:
    Type: AWS::ECS::Service
    DependsOn: [Listener, MountTargetA, MountTargetB]
    Properties:
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: true
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: kairos
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ------------------------------------------------------------------- edge
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '15' }
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      # With a certificate, port 80 exists only to say "use 443": a permanent
      # redirect, so a credential can never be typed across plain HTTP by
      # following an old link. Without one (the pre-domain demo), it forwards.
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  # One canonical address. The product lives at kairos.questo.media; www exists
  # only so a typed-from-habit www never dead-ends, and it answers with a
  # permanent redirect rather than a second identity. The certificate carries
  # both names, so the redirect itself is served over valid TLS.
  WwwToCanonicalRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig: { Values: [www.kairos.questo.media] }
      Actions:
        - Type: redirect
          RedirectConfig:
            Host: kairos.questo.media
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

Outputs:
  DashboardUrl:
    Value: !Sub http://${LoadBalancer.DNSName}/
    Description: The Kairos dashboard, auth wall first.
  FileSystemId:
    Value: !Ref FileSystem
    Description: Where the channel's data lives - and the only place it lives.
