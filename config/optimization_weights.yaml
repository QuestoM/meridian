# Kairos Optimization Weights, Premiums, and Constraints

# --- Base Pricing ---
# Base value for calculating ad revenue.
# E.g., ILS 60 per second for an ad achieving 1.0 TVR point.
base_price_per_second_per_tvr_point: 60.0

# --- Premium Multipliers (applied to base price/value) ---
premiums:
  program_type: # Multiplier based on the type of program the break is in
    News: 1.15       # e.g., News breaks command a 15% higher value
    PrimeShow1: 1.10 # First main show after news
    PrimeShow2: 1.00 # Second main show (baseline or slightly lower if fatigue sets in)
    Other: 0.80      # Non-prime or other content

  ad_type: # Multiplier based on the type of ad
    פרסומת: 1.00    # Standard commercial spot
    חסות: 1.05       # Sponsorship (often shorter, may have different perceived value)
    פרומו: 0.00       # Channel promo (typically no direct revenue, but can have placement goals)
    # Gold Break ads might be priced differently or fall under a special 'Ad_Type'

  position_in_break: # Multiplier for the position of a spot inside a break
    # The trade's positions are 1, 2, 3, 4, 5 and L, where L is LAST and is its
    # own position, not the fifth ordinal: the last spot of a three-spot break is
    # both position 3 and L. An ordinal priced here wins for a spot that holds
    # both; L prices the tail of any break whose tail ordinal is not priced here.
    # Ordinals 4 and 5 are addressable but deliberately UNSET, which is a no-op:
    # a spot at 4 or 5 keeps pricing at L (when it is the tail) or at the middle
    # default, exactly as before they became addressable. Setting one is a
    # deliberate, visible revenue change, like activating the layer itself.
    1: 1.30          # 30% premium for first in break
    2: 1.15          # 15% premium for second in break
    3: 1.05          # 5% premium for third in break
    default_middle: 1.00
    L: 1.20          # 20% premium for last in break. The legacy key "last" still reads.

  day_of_week: # Multiplier based on the day of the week (1=Monday, 7=Sunday)
    1: 1.00 # Monday
    2: 1.00 # Tuesday
    3: 1.00 # Wednesday
    4: 1.05 # Thursday
    5: 1.15 # Friday (Weekend start)
    6: 1.20 # Saturday (Prime weekend)
    7: 1.00 # Sunday

# --- Pricing layer activation (owner-gated, all default OFF) ---
# position / ad_type / show gate the extra premium layers in price_slot
# (kairos/optimize/pricing.py). qh_settlement gates the round-quarter-hour
# settlement revenue restatement (kairos/optimize/qh_billing.py,
# docs/quarter-hour-billing.md). events gates the event-date price multipliers
# the operator stores on calendar events (data/calendar_events.csv), an
# operator assertion like the day-of-week premiums. Each moves real reported
# revenue when switched on, so activation is a deliberate owner decision.
pricing_activation:
  position: false
  ad_type: false
  show: false
  qh_settlement: false
  # Required before qh_settlement may turn on. These remain blank until the
  # ingested rating rows carry the same explicit, auditable provenance.
  qh_audience_basis: ""
  qh_rating_vintage: ""
  qh_rating_source: ""
  events: false

# --- Preferred positions (per client and per agreement, so never a constant) ---
# Which of the six positions (1, 2, 3, 4, 5, L) count as PREFERRED is agreed with
# each client, so this is configuration. It is tri-state: null means UNSET, and
# while it is unset no preferred-position percentage may be computed anywhere,
# because a guessed or unlabelled percentage is worse than none (two parties
# audit each other with this number). An agreement row may override a client, and
# a client overrides the channel default. Shipped unset, so nothing computes one.
preferred_positions:
  channel_default: null
  per_advertiser: {}

# --- Constraints ---
constraints:
  max_regular_breaks_per_hour: 4
  max_gold_breaks_per_hour: 2 # "הפסקת זהב"
  # min_time_between_breaks_seconds: 600 # e.g., at least 10 minutes between breaks
  # max_total_ad_minutes_per_hour: 12 # Regulatory or policy limit

# --- Campaign Flighting Models ---
# Defines how an ad's value/priority changes over its campaign lifecycle.
# 'weights' are pairs of [percentage_of_campaign_duration_elapsed, weight_multiplier]
campaign_flighting_models:
  - name: "StandardRegressive"
    description: "Strong initial impact, then gradually declines. Default for most campaigns."
    weights:
      - [0.0, 1.20]  # Start of campaign (0% elapsed), 20% boost
      - [0.2, 1.10]  # After 20% of duration, 10% boost
      - [0.5, 1.00]  # Mid-campaign, baseline
      - [0.8, 0.90]  # Towards end, 10% reduction
      - [1.0, 0.80]  # End of campaign, 20% reduction
  - name: "UniformImpact"
    description: "Consistent weight throughout the campaign. For evergreen/awareness."
    weights:
      - [0.0, 1.00]
      - [1.0, 1.00]
  - name: "FrontLoadedBoost"
    description: "Very strong impact at launch, then quickly normalizes. For new product launches."
    weights:
      - [0.0, 1.50]  # 50% boost at launch
      - [0.1, 1.20]  # Quickly drops to 20% boost
      - [0.3, 1.00]  # Baseline after 30% of campaign
      - [1.0, 1.00]
