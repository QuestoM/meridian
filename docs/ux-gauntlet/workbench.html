<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שולחן העבודה של גאונטלט החוויה, מרידיאן</title>
<style>
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --t-micro:0.6875rem; --t-small:0.8125rem; --t-body:0.9375rem; --t-lead:1.0625rem;
  --t-h:1.1875rem; --t-stat:2rem; --t-hero:2.75rem;
  --canvas:#f3f4f7; --surface:#ffffff; --surface-2:#fafbfc;
  --ink:#14161a; --ink-2:#4a515e; --ink-3:#79808f;
  --line:#e0e4ea; --line-2:#c8cfd9; --accent:#23417d;
  --w-fg:#5b6270; --w-bg:#eceef2;
  --b-fg:#1f4fb0; --b-bg:#e6edfb;
  --c-fg:#8a5a00; --c-bg:#fbf0d9;
  --p-fg:#146442; --p-bg:#e2f2e9;
  --x-fg:#98262a; --x-bg:#fbe7e7;
  --d-fg:#6d6d6d; --d-bg:#efefef;
  --good:#146442; --bad:#98262a;
  --radius:8px;
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#0e1014; --surface:#161a20; --surface-2:#1b2027;
    --ink:#eef1f5; --ink-2:#a8b0bd; --ink-3:#79818f;
    --line:#262c35; --line-2:#39414d; --accent:#8fb0ee;
    --w-fg:#a2aab8; --w-bg:#232830;
    --b-fg:#9dbcf5; --b-bg:#1a2740;
    --c-fg:#e0b45f; --c-bg:#33280f;
    --p-fg:#7fd0a6; --p-bg:#12291f;
    --x-fg:#f09a9a; --x-bg:#32191a;
    --d-fg:#9a9a9a; --d-bg:#22242a;
    --good:#7fd0a6; --bad:#f09a9a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:var(--font); font-size:var(--t-body); line-height:1.55;
  font-feature-settings:"tnum" 0;
}
bdi{unicode-bidi:isolate}
.n,.stat-v,td.n,th.n{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
.wrap{max-width:1240px; margin-inline:auto; padding-inline:var(--s5)}
a{color:var(--accent); text-underline-offset:2px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* header */
header.top{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-block-end:1px solid var(--line);
}
.top-in{display:flex; align-items:center; gap:var(--s4); padding-block:var(--s3); flex-wrap:wrap}
.brand{font-size:var(--t-lead); font-weight:650; letter-spacing:-0.01em; margin:0}
.brand small{display:block; font-size:var(--t-micro); font-weight:400; color:var(--ink-3); letter-spacing:0}
nav.jump{margin-inline-start:auto; display:flex; gap:var(--s3); flex-wrap:wrap}
nav.jump a{font-size:var(--t-small); color:var(--ink-2); text-decoration:none}
nav.jump a:hover{color:var(--accent); text-decoration:underline}

/* provenance */
.prov{padding-block:var(--s3); border-block-end:1px solid var(--line); font-size:var(--t-small)}
.prov.live{background:var(--p-bg); color:var(--p-fg)}
.prov.embedded{background:var(--c-bg); color:var(--c-fg)}
.prov-in{display:flex; gap:var(--s4); align-items:flex-start; flex-wrap:wrap}
.prov b{font-weight:650}
.prov p{margin:0}
.prov .hint{display:block; color:inherit; opacity:.85; margin-block-start:var(--s2); max-width:92ch}
.prov code{font-family:var(--mono); font-size:0.95em; background:rgba(128,128,128,.16); padding:1px 5px; border-radius:4px}
.prov-act{margin-inline-start:auto; display:flex; gap:var(--s2); align-items:center}
button.btn{
  font:inherit; font-size:var(--t-small); padding:var(--s1) var(--s3);
  background:var(--surface); color:var(--ink); border:1px solid var(--line-2);
  border-radius:6px; cursor:pointer;
}
button.btn:hover{border-color:var(--accent); color:var(--accent)}

/* sections */
section{padding-block:var(--s6) 0}
section:last-of-type{padding-block-end:var(--s8)}
h2{
  font-size:var(--t-h); font-weight:650; margin:0 0 var(--s2); letter-spacing:-0.01em;
  display:flex; align-items:baseline; gap:var(--s3);
}
h2 .idx{font-size:var(--t-micro); color:var(--ink-3); font-weight:500; font-variant-numeric:tabular-nums}
h2 + .sub{margin:0 0 var(--s4); color:var(--ink-2); font-size:var(--t-small); max-width:78ch}
h3{font-size:var(--t-body); font-weight:650; margin:var(--s5) 0 var(--s2)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.pad{padding:var(--s5)}

/* hero phase */
.hero{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:var(--s5); align-items:stretch}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.phase-k{font-size:var(--t-micro); color:var(--ink-3); margin:0 0 var(--s2)}
.phase-v{font-size:var(--t-hero); font-weight:680; line-height:1.1; letter-spacing:-0.02em; margin:0}
.phase-since{font-size:var(--t-small); color:var(--ink-3); margin:var(--s2) 0 0}
.phase-sum{margin:var(--s4) 0 0; color:var(--ink-2); max-width:62ch}
.next{margin-block-start:var(--s5); padding-block-start:var(--s4); border-block-start:1px solid var(--line)}
.next .phase-k{margin-block-end:var(--s1)}
.next p{margin:0}
.next .who{font-size:var(--t-small); color:var(--ink-3); margin-block-start:var(--s1)}
.bigflag{
  margin-block-start:var(--s4); padding:var(--s3) var(--s4); border-radius:6px;
  background:var(--c-bg); color:var(--c-fg); font-size:var(--t-small);
}

/* stats */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.stat{background:var(--surface); padding:var(--s4)}
.stat-v{font-size:var(--t-stat); font-weight:660; line-height:1.05; letter-spacing:-0.02em}
.stat-v.muted{font-size:var(--t-lead); font-weight:600; color:var(--ink-3); letter-spacing:0}
.stat-k{font-size:var(--t-micro); color:var(--ink-3); margin-block-start:var(--s2)}
.stat-n{font-size:var(--t-micro); color:var(--ink-2); margin-block-start:var(--s1)}

/* tables */
table{width:100%; border-collapse:collapse; font-size:var(--t-small)}
thead th{
  text-align:start; font-weight:600; font-size:var(--t-micro); color:var(--ink-3);
  padding:var(--s2) var(--s3); border-block-end:1px solid var(--line-2); white-space:nowrap;
}
tbody td{padding:var(--s3); border-block-end:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-block-end:0}
tbody tr:hover{background:var(--surface-2)}
td.n,th.n{direction:ltr; text-align:right; white-space:nowrap}
td.id{font-family:var(--mono); font-size:var(--t-micro); color:var(--ink-2); white-space:nowrap}
td.tight{white-space:nowrap}
.tbl{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
caption{caption-side:top; text-align:start; padding:var(--s3) var(--s3) 0; font-size:var(--t-micro); color:var(--ink-3)}

/* chips */
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:var(--t-micro); white-space:nowrap; font-weight:550}
.chip::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.chip.waiting{background:var(--w-bg); color:var(--w-fg)}
.chip.building{background:var(--b-bg); color:var(--b-fg)}
.chip.in_critique{background:var(--c-bg); color:var(--c-fg)}
.chip.passed{background:var(--p-bg); color:var(--p-fg)}
.chip.blocked{background:var(--x-bg); color:var(--x-fg)}
.chip.deferred{background:var(--d-bg); color:var(--d-fg)}
.chip.plain::before{display:none}
.clamp{display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; max-width:42ch}
table.t-items{table-layout:fixed}
table.t-items th:nth-child(1),table.t-items td:nth-child(1){width:4.5em}
table.t-items th:nth-child(2),table.t-items td:nth-child(2){width:44%}
table.t-items th:nth-child(3),table.t-items td:nth-child(3){width:14%}
table.t-items th:nth-child(4),table.t-items td:nth-child(4){width:15%}
table.t-items td{overflow-wrap:anywhere}
.chip.plain{background:var(--w-bg); color:var(--w-fg); font-family:var(--mono)}

/* honest empty */
.unmeasured{color:var(--ink-3); border-block-end:1px dotted var(--line-2); padding-block-end:1px}
.emptybox{
  background:var(--surface); border:1px dashed var(--line-2); border-radius:var(--radius);
  padding:var(--s5); color:var(--ink-2); font-size:var(--t-small);
}
.emptybox b{color:var(--ink); font-weight:650; display:block; margin-block-end:var(--s2); font-size:var(--t-body)}

/* pieces */
.wavehead{display:flex; align-items:baseline; gap:var(--s3); margin:var(--s5) 0 var(--s3)}
.wavehead h3{margin:0}
.wavehead .meta{font-size:var(--t-micro); color:var(--ink-3)}
details.piece{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-block-end:var(--s2)}
details.piece[open]{border-color:var(--line-2)}
details.piece > summary{
  list-style:none; cursor:pointer; padding:var(--s3) var(--s4);
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:var(--s3); align-items:center;
}
details.piece > summary::-webkit-details-marker{display:none}
.p-id{font-family:var(--mono); font-size:var(--t-micro); color:var(--ink-2); min-width:3.2em}
.p-name{font-weight:600}
.p-name .en{font-weight:400; color:var(--ink-3); font-size:var(--t-small); margin-inline-start:var(--s2)}
.p-right{display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; justify-content:flex-end}
.p-body{padding:0 var(--s4) var(--s4); border-block-start:1px solid var(--line); margin-block-start:var(--s1); padding-block-start:var(--s4)}
.kv{display:grid; grid-template-columns:9.5em minmax(0,1fr); gap:var(--s2) var(--s4); font-size:var(--t-small)}
.kv dt{color:var(--ink-3); font-size:var(--t-micro); padding-block-start:2px}
.kv dd{margin:0}
.kv dd ul{margin:0; padding-inline-start:1.1em}
.filelist{font-family:var(--mono); font-size:var(--t-micro); color:var(--ink-2); line-height:1.7}
.filelist span{display:inline-block; background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:0 5px; margin:0 0 3px 3px}

/* rounds */
.round{border-inline-start:2px solid var(--line-2); padding-inline-start:var(--s4); margin-block-start:var(--s4)}
.round-h{display:flex; gap:var(--s3); align-items:baseline; flex-wrap:wrap}
.round-h b{font-size:var(--t-body)}
.round-h .when{font-size:var(--t-micro); color:var(--ink-3)}
.round dl{margin:var(--s3) 0 0}
.gap{background:var(--surface-2); border-inline-start:3px solid var(--c-fg); padding:var(--s3) var(--s4); border-radius:0 6px 6px 0; margin-block-start:var(--s3)}
.gap .phase-k{margin-block-end:var(--s1)}
.measures{display:flex; gap:var(--s4); flex-wrap:wrap; margin-block-start:var(--s3)}
.measure{background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:var(--s2) var(--s3); min-width:110px}
.measure .v{font-size:var(--t-lead); font-weight:650; font-variant-numeric:tabular-nums}
.measure .k{font-size:var(--t-micro); color:var(--ink-3)}

.notelist{margin:var(--s2) 0 0; padding-inline-start:1.1em; color:var(--ink-2)}
.notelist li{margin-block-end:var(--s1)}
.foot{margin-block-start:var(--s7); padding-block:var(--s5); border-block-start:1px solid var(--line); color:var(--ink-3); font-size:var(--t-micro)}
.foot p{margin:0 0 var(--s1)}
.srcs{display:flex; flex-wrap:wrap; gap:var(--s1) var(--s3); margin-block-start:var(--s2)}
.srcs span{font-family:var(--mono)}
@media print{
  header.top{position:static} details.piece{break-inside:avoid} nav.jump{display:none}
  body{background:#fff}
}
</style>

ק מגיעה מצד התוכנית ולא מהקובץ היומי. רק מילוי ברייק בתשדירים היסטוריים אמיתיים ממתין.","asked_on":"2026-07-31","answered_on":null,"answer":null,"status":"open"},{"id":"D3","number":3,"title_he":"יעד התוכנית, מול מה נמדד שבוע","question_he":"מהו המספר, היחידה שלו, הרזולוציה שלו ומי הבעלים שלו. למשל הכנסה חזויה שבועית לערוץ, שנקבעת על ידי אחראי ההכנסות בכל רבעון.","evidence_he":["האם השבוע עומד בתוכנית היא הראשונה משלוש התשובות שהמנהל הכללי מבקש, והיחידה שהמוצר אינו יכול לתת.","111 המפתחות של נקודת הקצה של הסקירה נסרקו על goal, target, budget, on_plan ו־variance, וההתאמה היחידה הייתה שדה לא קשור.","אין ישות תקציב, יעד או מכסה בשום מקום במודל הנתונים.","יעד לא ייגזר מהתוכנית עצמה. זה מעגלי: התוכנית תמיד תעמוד בדיוק בתוכנית."],"options_he":["הכנסה, GRP, דקות פרסום או ברייקים, כולם עובדים. צריך לדעת מול מה אתם באמת מנהלים, ומה הסף שמפריד בין עומד בתוכנית לבין בסיכון לבין מפגר."],"recommendation_he":"הכנסה חזויה שבועית לערוץ, עם סף דו צדדי שנקבע פעם אחת, כי זה הגודל היחיד שהתוכנית כבר מחשבת ברזולוציה הזאת ואינו דורש מדידה חדשה כדי להיות כן. אם אתם מנהלים מול GRP, המנגנון זהה והמחסן הוא עמודה בשני המקרים.","blocks_pieces":["P1"],"blocks_stories":["JS-1"],"blocks_note_he":"עד לתשובה, עמוד היום נשלח עם מצב ריק כן שנוקב בקלט החסר ומציע את המסלול להגדיר אותו. זה אינו מספר ממלא מקום ולעולם לא יהיה.","asked_on":"2026-07-31","answered_on":null,"answer":null,"status":"open"},{"id":"D4","number":4,"title_he":"שבוע נוכחי, ומאיפה מגיעה האספקה בפועל","question_he":"שלושה דברים: שבוע שידור נוכחי או קרוב עם לוח השידורים שלו, טיסות קמפיין אמיתיות עם תאריכים ויעדי אספקה, והזנת אספקה או שידור בפועל.","evidence_he":["שום דבר במערכת לא מייצג עכשיו: תאריך התחולה הוא 2026-06-14, התוכנית השמורה מכסה נובמבר 2024, וקובץ התשדירים היומי היחיד הוא מאפריל 2025. שלושה כרכי זמן על המסך ואף אחד מהם אינו היום.","קובץ טיסות הקמפיין הוא כותרת בלבד, אפס שורות, ונקודת הקצה של התרעות הפיצוי עונה שאין נתונים ונוקבת בשם הקובץ.","מתמטיקת הקצב שמאחוריה אמיתית, ממומשת וכנה. פשוט אין לה על מה לרוץ.","חוזה אחד עשרה העמודות לטיסות כבר קיים בקוד ודלת הקליטה כבר בנויה."],"options_he":["לשלוח את הראשון והשני קודם, גם בלי השלישי."],"recommendation_he":"לשלוח 1 ו־2 קודם. עם שבוע נוכחי ועם טיסות אמיתיות, לוח הקצב הופך לכן בכל דבר חוץ מאספקה חיה, וחלק הקצב יכול לשלוח את היעד, את מצב התחזית ואת עצם הפיצוי כשהאספקה מוצגת כלא זמינה ולא כניחוש. זה רוב הערך והוא אינו ממתין לאינטגרציה.","blocks_pieces":["P11","P13"],"blocks_stories":["JS-6","JS-8"],"blocks_note_he":"חוסם גם את המחצית שנמסרה בפועל של שכבת הכסף. המפרט קובע את הגבול במפורש: חזוי ונמסר לעולם אינם מסוכמים לסכום אחד כל עוד הם מכסים תאריכים שאינם חופפים.","asked_on":"2026-07-31","answered_on":null,"answer":null,"status":"open"},{"id":"D5","number":5,"title_he":"הפצה, ומי מחזיק את המגבלות הרגולטוריות","question_he":"שתי שאלות בעלות אותה צורה: אילו פעולות דורשות סמכות ששלושת התפקידים הקיימים אינם יכולים לבטא.","evidence_he":["5א. המילה publish מופיעה אפס פעמים בקוד השרת, ותוכנית השבוע איננה אחד מתשעת הקבצים הלוגיים שמחסן הגרסאות שומר. אין מצב מופץ, אין מחבר, ואין תיעוד של מה החליף את מה.","5ב. 12.0 דקות פרסום לשעה, 4 ברייקים לשעה, 7 דקות ריווח מינימלי ו־8.0 דקות בתוכן מוגן הם שדות הגדרות רגילים, ניתנים לעריכה באותה הרשאה בדיוק כמו מחוון משקל ההכנסה.","אין אישור, אין תהליך תאריך תחולה ואין התרעה כשאחד מהם משתנה. אחראי הציות אחראי למספרים שכל אחד יכול להזיז בלי לומר לו."],"options_he":["5א. האם הפצה היא הקפאה פנימית, או שהיא פולטת משהו למישהו, והאם מתכנן רשאי להפיץ לבד או שנדרש אדם שני.","5ב. האם אחראי הציות שלכם צריך להחזיק את המעקים, ואז זהו תפקיד רביעי."],"recommendation_he":"5א: הפצה היא הקפאה פנימית ועוד גרסה בעלת שם, שמבצע המתכנן לבד, עם הגרסה הקודמת במרחק קליק אחד. זה הדבר הקטן ביותר שמספק את תנאי הסיום והוא אינו פולט דבר, ולכן אינו יכול לטעות לגבי מערכת במורד הזרם שאיש עוד לא נקב בשמה. 5ב: המעקים עוברים למחסן משלהם עם תאריך תחולה, רשומת שינוי והרשאה נפרדת, ועד שינקבו בבעלים אמיתי הם מגודרים לצד החברה. המנגנון כבר מוכח בקוד עבור אירועי לוח, ולכן אינו חדש.","blocks_pieces":["P2","P5","W0-4"],"blocks_stories":["JS-2","JS-14"],"b <script>
(function(){
"use strict";
var W=(window.__WB__={});

/* ---------- text helpers ---------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
/* Wrap Latin and digit runs so they do not scramble inside Hebrew. */
var LATIN=/[₪A-Za-z0-9][A-Za-z0-9_\-\/:%+#*'"\[\]()]*(?:(?:[.,]{1,2}(?=[A-Za-z0-9])|,?[ ](?=[₪A-Za-z0-9\/\-]))[₪A-Za-z0-9\/\-][A-Za-z0-9_\-\/:%+#*'"\[\]()]*)*/g;
function t(str){
  if(str==null) return "";
  var s=String(str), out="", last=0, m;
  LATIN.lastIndex=0;
  while((m=LATIN.exec(s))!==null){
    out+=esc(s.slice(last,m.index));
    out+='<bdi dir="ltr">'+esc(m[0])+"</bdi>";
    last=m.index+m[0].length;
    if(m.index===LATIN.lastIndex) LATIN.lastIndex++;
  }
  return out+esc(s.slice(last));
}
function num(v){
  if(v==null) return unmeasured();
  return '<bdi dir="ltr" class="n">'+esc(typeof v==="number"?v.toLocaleString("en-US"):v)+"</bdi>";
}
function unmeasured(word){ return '<span class="unmeasured">'+esc(word||"טרם נמדד")+"</span>"; }
function list(a){ return (a||[]).map(function(x){return "<li>"+t(x)+"</li>";}).join(""); }
/* the label is wrapped so that a <bdi> inside it stays inline text
   instead of becoming a separate flex item and losing its spaces */
function chip(status,label){ return '<span class="chip '+esc(status)+'"><span>'+t(label)+"</span></span>"; }
function tag(s){ return '<span class="chip plain"><span>'+t(s)+"</span></span>"; }

var STATUS={
  waiting:"ממתין", building:"בבנייה", in_critique:"בביקורת",
  passed:"עבר", blocked:"חסום", deferred:"נדחה"
};
var VERDICT={
  passes:"עובר", partial:"חלקי", cannot_start:"לא ניתן להתחיל", fails:"נכשל",
  not_ready:"לא מוכן", ready:"מוכן"
};
function verdictClass(v){
  if(v==="passes"||v==="ready") return "passed";
  if(v==="partial") return "in_critique";
  if(v==="cannot_start"||v==="fails"||v==="not_ready") return "blocked";
  return "waiting";
}

/* ---------- time ---------- */
function fmtDate(iso){
  if(!iso) return null;
  var d=new Date(iso);
  if(isNaN(d)) return String(iso);
  function p(n){return (n<10?"0":"")+n;}
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function ageText(iso){
  var d=new Date(iso);
  if(isNaN(d)) return null;
  var ms=Date.now()-d.getTime();
  if(ms<0) return "חותמת הזמן של הקובץ מאוחרת משעון הדפדפן";
  var mins=Math.round(ms/60000);
  if(mins<1) return "פחות מדקה";
  if(mins<60) return "לפני "+mins+" דקות";
  var h=Math.round(mins/60);
  if(h<24) return "לפני "+h+" שעות";
  var days=Math.round(h/24);
  return "לפני "+days+" ימים";
}

/* ---------- bootstrap ---------- */
var EMBED=null;
try{ EMBED=JSON.parse(document.getElementById("embedded-state").textContent); }catch(e){ EMBED=null; }

function boot(){
  fetch("state.json",{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(js){
    W.render(js,{mode:"live",embedded:EMBED});
  }).catch(function(err){
    if(EMBED && !EMBED.__EMBED_PLACEHOLDER__){
      W.render(EMBED,{mode:"embedded",reason:String(err&&err.message||err)});
    }else{
      document.getElementById("prov").innerHTML=
        '<div class="prov embedded"><div class="wrap prov-in"><p><b>אין מצב להציג.</b> '+
        'קריאת <code>state.json</code> נכשלה ואין עותק מוטמע בדף. אין מה לרנדר, ולכן הדף אינו מציג דבר במקום להציג ניחוש.</p></div></div>';
    }
  });
}

function pickFile(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{ W.render(JSON.parse(fr.result),{mode:"picked",filename:f.name,picked_at:new Date().toISOString()}); }
      catch(e){ alert("הקובץ שנבחר אינו JSON תקין: "+e.message); }
    };
    fr.readAsText(f);
  });
  inp.click();
}

/* ---------- provenance strip ---------- */
var SJ='<bdi dir="ltr">state.json</bdi>';
function renderProv(S,src){
  var gen=S.meta&&S.meta.generated_at, age=gen?ageText(gen):null, when=gen?fmtDate(gen):null;
  var h="";
  if(src.mode==="live"){
    var drift="";
    if(src.embedded && !src.embedded.__EMBED_PLACEHOLDER__ && src.embedded.meta &&
       src.embedded.meta.generated_at!==gen){
      drift=' העותק המוטמע בדף עצמו ישן יותר, מ־'+t(fmtDate(src.embedded.meta.generated_at))+", והוא אינו זה שמוצג כאן.";
    }
    h='<div class="prov live"><div class="wrap prov-in"><p><b>מוצג מתוך '+SJ+' החי.</b> '+
      "נכתב "+t(when)+", "+t(age)+"."+drift+"</p></div></div>";
  }else if(src.mode==="picked"){
    h='<div class="prov live"><div class="wrap prov-in"><p><b>מוצג מתוך קובץ שנבחר ידנית.</b> '+
      t(src.filename)+", נכתב "+t(when)+", "+t(age)+".</p>"+
      '<div class="prov-act"><button class="btn" id="pick">בחרו קובץ אחר</button></div></div></div>';
  }else{
    h='<div class="prov embedded"><div class="wrap prov-in"><p><b>מוצג מתוך העותק המוטמע בדף, לא מתוך '+SJ+'.</b> '+
      "הדף נפתח מהדיסק, ולכן הדפדפן חוסם קריאת קבצים לידו. העותק המוטמע נכתב "+t(when)+", "+t(age)+
      ", והמצב בפועל עשוי להיות חדש יותר, כי סוכנים מעדכנים את "+SJ+" ולא את הדף."+
      '<span class="hint">כדי לראות את המצב החי, הריצו מתוך תיקיית הגאונטלט <code dir="ltr">python3 -m http.server 8021</code> ופתחו '+
      '<code dir="ltr">http://127.0.0.1:8021/workbench.html</code>, או בחרו את הקובץ ידנית כאן.</span></p>'+
      '<div class="prov-act"><button class="btn" id="pick">בחרו את '+SJ+"</button></div></div></div>";
  }
  document.getElementById("prov").innerHTML=h;
  var b=document.getElementById("pick"); if(b) b.addEventListener("click",pickFile);
}

/* The baseline provenance: a standing warning until it was settled, and a
   settled finding afterwards. Bar 3 rests on it, so it stays on the first screen. */
function provenanceBlock(S){
  var bp=S.campaign.baseline_provenance;
  if(!bp){
    return '<div class="next"><p class="phase-k">אזהרת מקור שעוברת דרך כל המספרים</p>'+
      "<p>"+t(S.campaign.provenance_warning_he)+"</p></div>";
  }
  var settled=bp.verdict==="current";
  return '<div class="next"><p class="phase-k">'+t("מקור מדידת הבסיס, שרף 3 עומד עליו")+"</p>"+
    "<p>"+chip(settled?"passed":"blocked",bp.verdict_he)+"</p>"+
    "<p class='who' style='margin-block-start:var(--s2)'>"+t(bp.consequence_he)+"</p>"+
    "<details style='margin-block-start:var(--s3)'><summary style='cursor:pointer;font-size:var(--t-small);color:var(--accent)'>"+
      t("הראיות שהכריעו, "+bp.evidence_he.length+" בדיקות")+"</summary>"+
      "<p style='margin:var(--s3) 0 0;font-size:var(--t-small)'>"+t(S.campaign.provenance_warning_he)+"</p>"+
      "<p style='color:var(--ink-3);font-size:var(--t-micro);margin:var(--s2) 0 0'>"+t(bp.method_he)+"</p>"+
      "<ul class='notelist' style='font-size:var(--t-small)'>"+list(bp.evidence_he)+"</ul>"+
      "<p style='color:var(--ink-3);font-size:var(--t-micro);margin:0'>"+t(bp.floor_note_he)+"</p>"+
    "</details>"+cleanBaselineBlock(S)+"</div>";
}

/* A property the lead relies on to diff a whole wave, and one that expires the
   moment that wave commits, so it is rendered with its measurement and its expiry. */
function cleanBaselineBlock(S){
  var cb=S.campaign.clean_baseline_property;
  if(!cb) return "";
  return "<details style='margin-block-start:var(--s3);padding-block-start:var(--s3);border-block-start:1px solid var(--line)'>"+
    "<summary style='cursor:pointer;list-style:none'>"+
      '<span class="phase-k" style="display:inline">'+t("בסיס נקי להשוואת הגל")+"</span> "+
      chip(cb.holds?"passed":"blocked",cb.holds?"מחזיקה":"אינה מחזיקה עוד")+
    "</summary>"+
    "<p style='margin-block-start:var(--s3);font-size:var(--t-small)'>"+t(cb.statement_he)+"</p>"+
    "<div class='measures'>"+
      '<div class="measure"><div class="v">'+num(cb.committed_non_docs_changes_since_reference)+
        '</div><div class="k">קבצי מוצר ששונו בהיסטוריה</div></div>'+
      '<div class="measure"><div class="v">'+num(cb.working_tree_non_docs_modified)+
        '</div><div class="k">שונו בעץ העבודה</div></div>'+
      '<div class="measure"><div class="v">'+num(cb.working_tree_non_docs_untracked)+
        '</div><div class="k">חדשים בעץ העבודה</div></div>'+
    "</div>"+
    "<p style='margin-block-start:var(--s3);font-size:var(--t-small)'>"+t(cb.why_it_matters_he)+"</p>"+
    "<p class='who' style='margin-block-start:var(--s3)'>"+t(cb.expires_he)+"</p>"+
    "<p style='color:var(--ink-3);font-size:var(--t-micro);margin:var(--s1) 0 0'>"+
      t("נמדד "+fmtDate(cb.measured_at)+". ")+t(cb.how_to_recheck_he)+"</p>"+
  "</details>";
}

/* ---------- 1. where the run is ---------- */
function sectionNow(S){
  var ph=S.campaign.phase, pieces=S.pieces.filter(function(p){return p.id!=="SPEC";});
  var started=pieces.filter(function(p){return p.status!=="waiting";}).length;
  var remeasured=S.job_stories.filter(function(j){return j.current!=null;}).length;
  var served=S.job_stories.filter(function(j){return j.baseline&&j.baseline.verdict==="passes";}).length;
  var openD=S.decisions.filter(function(d){return d.status==="open";}).length;
  var judged=S.rounds.filter(function(r){return r.verdict!=null;}).length;
  var v=S.campaign.verification||{};

  var flag=ph.build_started?"":'<p class="bigflag">'+t(ph.build_started_note_he)+"</p>";

  var hero=
    '<div class="hero">'+
      '<div class="card pad">'+
        '<p class="phase-k">השלב</p>'+
        '<p class="phase-v">'+t(ph.label_he)+"</p>"+
        '<p class="phase-since">'+t(ph.label_en)+", מאז "+num(ph.since)+"</p>"+
        '<p class="phase-sum">'+t(ph.summary_he)+"</p>"+
        flag+
      "</div>"+
      '<div class="card pad">'+
        '<div class="next" style="margin-block-start:0;padding-block-start:0;border:0">'+
          '<p class="phase-k">הפעולה הבאה</p>'+
          "<p>"+t(ph.next_action_he)+"</p>"+
          '<p class="who">על מי: '+t(ph.next_action_owner_he)+"</p>"+
        "</div>"+
        provenanceBlock(S)+
      "</div>"+
    "</div>";

  /* v_ and n arrive as built html; k is plain text */
  function stat(v_,k,n,muted){
    return '<div class="stat"><div class="stat-v'+(muted?" muted":"")+'">'+v_+'</div>'+
      '<div class="stat-k">'+t(k)+"</div>"+(n?'<div class="stat-n">'+n+"</div>":"")+"</div>";
  }
  function ofN(x,total){
    return num(x)+' <span style="color:var(--ink-3);font-size:var(--t-lead)">/ '+num(total)+"</span>";
  }
  var stats='<div class="stats" style="margin-block-start:var(--s5)">'+
    stat(ofN(started,pieces.length),"חלקי בנייה שנפתחו",(function(){
      var by={},order=["building","in_critique","passed","blocked","deferred","waiting"];
      var many={waiting:"ממתינים",building:"בבנייה",in_critique:"בביקורת",passed:"עברו",blocked:"חסומים",deferred:"נדחו"};
      pieces.forEach(function(p){ by[p.status]=(by[p.status]||0)+1; });
      return order.filter(function(k){return by[k];}).map(function(k){
        return num(by[k])+t(" "+(many[k]||STATUS[k]||k));
      }).join(t(", "));
    })())+
    stat(ofN(remeasured,S.job_stories.length),"סיפורי עבודה שנמדדו מחדש",t("אין שיפור ואין נסיגה להציג"))+
    stat(ofN(served,S.job_stories.length),"סיפורים שהמוצר משרת היום במלואם",t("נמדד מול האפליקציה הרצה"))+
    stat(num(openD),"החלטות שממתינות לבעלים",t("כל אחת חוסמת חלק בשמו"))+
    stat(num(S.rounds.length),"סבבים שנרשמו",num(judged)+t(" עם פסיקת מבקר"))+
    stat(num(v.tests_collected),"בדיקות שנאספות בחבילה",t("מספר העוברות לא נמדד"))+
  "</div>";

  var tl='<div class="tbl" style="margin-block-start:var(--s5)"><table><caption>'+
    t("ציר הזמן של הריצה, לפי זמן השינוי של הקבצים על הדיסק")+
    "</caption><thead><tr><th>מתי</th><th>מה קרה</th><th>פירוט</th></tr></thead><tbody>"+
    S.campaign.timeline.map(function(e){
      return "<tr><td class='n'>"+esc(fmtDate(e.at))+"</td><td class='tight'><b>"+t(e.title_he)+
        "</b></td><td>"+t(e.detail_he)+"</td></tr>";
    }).join("")+"</tbody></table></div>";

  return '<section id="now"><h2><span class="idx">1</span>איפה הריצה עכשיו</h2>'+hero+stats+tl+"</section>";
}

/* ---------- 2. what is blocked and on whom ---------- */
function sectionBlocked(S){
  var byDec={};
  S.pieces.forEach(function(p){
    (p.blocked_by_decisions||[]).forEach(function(d){ (byDec[d]=byDec[d]||[]).push(p.id); });
  });
  var rows=S.decisions.map(function(d){
    var pcs=(byDec[d.id]||d.blocks_pieces||[]);
    return "<tr>"+
      '<td class="id">'+t(d.id)+"</td>"+
      "<td><b>"+t(d.title_he)+"</b><div style='color:var(--ink-2);margin-block-start:4px'>"+t(d.question_he)+"</div></td>"+
      "<td>"+pcs.map(tag).join(" ")+"<div style='margin-block-start:4px'>"+
        (d.blocks_stories||[]).map(tag).join(" ")+"</div></td>"+
      '<td class="clamp" title="'+esc(d.recommendation_he)+'">'+t(d.recommendation_he)+"</td>"+
      '<td class="tight">'+chip("blocked","פתוחה")+"<div style='color:var(--ink-3);font-size:var(--t-micro);margin-block-start:4px'>נשאלה "+num(d.asked_on)+"</div></td>"+
    "</tr>";
  }).join("");

  var depBlocked=S.pieces.filter(function(p){return (p.depends_on||[]).length>0;}).length;

  var items=(S.open_items||[]);
  var itemsHtml="";
  if(items.length){
    itemsHtml="<h3>ופריטים שאינם החלטה מסחרית, אבל אף בונה לא יכול לסגור אותם לבד</h3>"+
      '<div class="tbl"><table class="t-items"><thead><tr><th>מזהה</th><th>הפריט</th><th>על מי</th><th>מה זה עוצר</th><th>מצב</th></tr></thead><tbody>'+
      items.map(function(o){
        var st=o.status==="open"?"blocked":(o.status==="partly_closed"?"in_critique":"passed");
        var lbl=o.status==="open"?"פתוח":(o.status==="partly_closed"?"נסגר חלקית":"נסגר");
        return "<tr>"+
          '<td class="id">'+t(o.id)+"</td>"+
          "<td><b>"+t(o.title_he)+"</b><div style='color:var(--ink-2);margin-block-start:4px'>"+t(o.detail_he)+"</div>"+
            (o.closed_detail_he?"<div style='color:var(--p-fg);margin-block-start:6px'>"+t(o.closed_detail_he)+
              "<div style='color:var(--ink-3);font-size:var(--t-micro);margin-block-start:3px'>"+t(o.closed_source)+"</div></div>":"")+"</td>"+
          "<td class='tight'>"+t(o.owner_he)+"</td>"+
          "<td>"+t(o.blocks_he)+"</td>"+
          '<td class="tight">'+chip(st,lbl)+"<div style='color:var(--ink-3);font-size:var(--t-micro);margin-block-start:4px'>"+t(o.source)+"</div></td>"+
        "</tr>";
      }).join("")+"</tbody></table></div>";
  }

  return '<section id="blocked"><h2><span class="idx">2</span>מה חסום ועל מי</h2>'+
    '<p class="sub">כל שאלה אחרת שהגילוי העלה נענתה מתוך הקוד והנתונים. חמש אלה לא ניתנות להכרעה כך, וכל אחת מהן חוסמת חלק בנייה בשמו. '+
    "מעבר להן, "+num(depBlocked)+" חלקים חסומים על רצף הריצה ולא על אדם: הם תלויים בחלק שקדם להם.</p>"+
    '<div class="tbl"><table><thead><tr><th>מזהה</th><th>ההחלטה</th><th>מה היא חוסמת</th><th>ההמלצה בשורה אחת</th><th>מצב</th></tr></thead><tbody>'+
    rows+"</tbody></table></div>"+itemsHtml+"</section>";
}

/* ---------- 3. job stories against baseline ---------- */
function deltaOf(m){
  if(!m||m.baseline==null||m.current==null) return null;
  var d=m.current-m.baseline;
  var improved=m.lower_is_better?(d<0):(d>0);
  var pct=(m.baseline===0)?null:Math.abs(d)/Math.abs(m.baseline)*100;
  return {abs:Math.abs(d),improved:improved,pct:pct,same:d===0};
}
function sectionStories(S){
  var measured=S.job_stories.filter(function(j){return j.current!=null;});
  var head;
  if(measured.length===0){
    head='<div class="emptybox"><b>אף סיפור עבודה לא נמדד מחדש.</b>'+
      "כל תשעה עשר הסיפורים נושאים את מדידת הבסיס של היום ואת היעד המוקפא שלהם, והעמודה של הערך הנוכחי ריקה בכולם. "+
      "אין שיפור להציג וגם אין נסיגה. הערך הנוכחי נכתב רק כשמבקר מדד אותו בדפדפן מול האפליקציה הרצה, בשניות, בקליקים ובמסכים.</div>";
  }else{
    var up=measured.filter(function(j){var d=deltaOf(j.metric); return d&&d.improved;}).length;
    var down=measured.filter(function(j){var d=deltaOf(j.metric); return d&&!d.improved&&!d.same;}).length;
    head='<div class="stats">'+
      '<div class="stat"><div class="stat-v">'+num(measured.length)+'</div><div class="stat-k">נמדדו מחדש</div></div>'+
      '<div class="stat"><div class="stat-v" style="color:var(--good)">'+num(up)+'</div><div class="stat-k">השתפרו מול הבסיס</div></div>'+
      '<div class="stat"><div class="stat-v" style="color:var(--bad)">'+num(down)+'</div><div class="stat-k">נסוגו מול הבסיס</div></div>'+
      "</div>";
  }

  var rows=S.job_stories.map(function(j){
    var m=j.metric||{}, d=deltaOf(m);
    var cur=j.current!=null?num(j.current):unmeasured(j.current_note_he||"טרם נמדד");
    var del;
    if(!d) del=unmeasured("אין מה להשוות");
    else if(d.same) del="ללא שינוי";
    else del='<span style="color:'+(d.improved?"var(--good)":"var(--bad)")+'">'+
      (d.improved?"טוב יותר ב־":"גרוע יותר ב־")+num(Math.round(d.abs))+" "+t(m.unit||"")+"</span>";
    var base=(m.baseline!=null)?num(m.baseline)+" "+t(m.unit||""):unmeasured("אין ערך בר השוואה");
    return "<tr>"+
      '<td class="id">'+t(j.id)+"</td>"+
      "<td class='tight'><b>"+t(j.person_he)+"</b><div style='color:var(--ink-3);font-size:var(--t-micro)'>"+t(j.person_en)+"</div></td>"+
      "<td>"+t(j.title_he)+"<div style='color:var(--ink-2);margin-block-start:4px'>"+t(j.target_he)+"</div></td>"+
      '<td class="tight">'+chip(verdictClass(j.baseline.verdict),j.baseline.verdict_he)+
        "<div style='color:var(--ink-2);margin-block-start:6px;white-space:normal;max-width:30ch'>"+t(j.baseline.display_he)+"</div></td>"+
      '<td class="n">'+(m.target!=null?num(m.target)+" "+t(m.unit||""):unmeasured("אין יעד מספרי"))+"</td>"+
      '<td class="n">'+base+(m.baseline_caveat_he?"<div style='color:var(--ink-3);font-size:var(--t-micro);white-space:normal;max-width:26ch;direction:rtl;text-align:start'>"+t(m.baseline_caveat_he)+"</div>":"")+"</td>"+
      '<td class="n">'+cur+"</td>"+
      '<td class="n">'+del+"</td>"+
    "</tr>";
  }).join("");

  return '<section id="stories"><h2><span class="idx">3</span>סיפורי העבודה מול הבסיס</h2>'+
    '<p class="sub">תשעה עשר סיפורים מוקפאים. היעד אינו זז ותנאי הסיום אינו מרוכך. עמודת המדד היא הכמות היחידה שאפשר להשוות עליה, '+
    "ובמקום שבו הבסיס אינו בר השוואה, למשל כשהמוצר אינו יכול להתחיל את העבודה בכלל, העמודה אומרת זאת במקום להציג אפס.</p>"+
    head+
    '<div class="tbl" style="margin-block-start:var(--s4)"><table><thead><tr>'+
    "<th>מזהה</th><th>מי</th><th>העבודה והיעד</th><th>הבסיס היום</th><th class='n'>יעד</th><th class='n'>בסיס</th><th class='n'>נוכחי</th><th class='n'>הפרש</th>"+
    "</tr></thead><tbody>"+rows+"</tbody></table></div></section>";
}

/* ---------- 4. what is still open ---------- */
function sectionOpen(S){
  var pieces=S.pieces.filter(function(p){return p.id!=="SPEC";});
  var waiting=pieces.filter(function(p){return p.status==="waiting";});
  var cannot=S.job_stories.filter(function(j){return j.baseline.verdict==="cannot_start";});
  var partial=S.job_stories.filter(function(j){return j.baseline.verdict==="partial";});
  var fails=S.job_stories.filter(function(j){return j.baseline.verdict==="fails";});
  var openD=S.decisions.filter(function(d){return d.status==="open";});
  var spec=S.pieces.filter(function(p){return p.id==="SPEC";})[0];
  var lastRound=S.rounds[S.rounds.length-1];

  function box(title,body){
    return '<div class="card pad"><p class="phase-k">'+t(title)+"</p>"+body+"</div>";
  }
  var openItems=(S.open_items||[]).filter(function(o){return o.status!=="closed";});
  var grid='<div class="hero" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">'+
    box(spec.status==="passed"?"השער שנפתח":"השער שכולם ממתינים לו",
      "<p style='margin:0'><b>"+t(spec.name_he)+"</b>, "+chip(spec.status,STATUS[spec.status]||spec.status)+"</p>"+
      "<p style='margin:var(--s2) 0 0;color:var(--ink-2);font-size:var(--t-small)'>"+t(spec.status_detail_he)+"</p>"+
      "<p style='margin:var(--s3) 0 0;font-size:var(--t-small)'>"+t(lastRound.next_action_he)+"</p>"+
      (openItems.length?"<p style='margin:var(--s3) 0 0;font-size:var(--t-small)'>"+num(openItems.length)+
        t(" פריטים פתוחים שאף בונה לא יכול לסגור לבד.")+"</p>":""))+
    box("חלקי בנייה שטרם נפתחו",
      '<p class="stat-v" style="margin:0">'+num(waiting.length)+"</p>"+
      "<div style='margin-block-start:var(--s3)'>"+waiting.map(function(p){return tag(p.id);}).join(" ")+"</div>")+
    box("סיפורים שהמוצר אינו יכול להתחיל היום",
      '<p class="stat-v" style="margin:0">'+num(cannot.length)+"</p>"+
      "<div style='margin-block-start:var(--s3)'>"+cannot.map(function(j){return tag(j.id);}).join(" ")+"</div>"+
      "<p style='margin:var(--s3) 0 0;color:var(--ink-2);font-size:var(--t-small)'>ועוד "+num(partial.length)+
      " חלקיים ו־"+num(fails.length)+" שנכשל בכל ארבע הדלתות שנבדקו.</p>")+
    box("החלטות שממתינות לבעלים",
      '<p class="stat-v" style="margin:0">'+num(openD.length)+"</p>"+
      "<div style='margin-block-start:var(--s3)'>"+openD.map(function(d){return tag(d.id);}).join(" ")+"</div>"+
      "<p style='margin:var(--s3) 0 0;color:var(--ink-2);font-size:var(--t-small)'>אף אחת מהן לא נענתה ואף אחת לא נחסמה בשקט.</p>")+
    "</div>";

  return '<section id="open"><h2><span class="idx">4</span>מה עדיין פתוח</h2>'+
    '<p class="sub">ארבע ספירות, כולן נגזרות מהקובץ הזה ולא נכתבות ביד.</p>'+grid+"</section>";
}

/* ---------- exports for the second script ---------- */
W.t=t; W.esc=esc; W.num=num; W.unmeasured=unmeasured; W.chip=chip; W.tag=tag; W.list=list;
W.fmtDate=fmtDate; W.ageText=ageText; W.STATUS=STATUS; W.VERDICT=VERDICT; W.verdictClass=verdictClass;
W.renderProv=renderProv; W.sectionNow=sectionNow; W.sectionBlocked=sectionBlocked;
W.sectionStories=sectionStories; W.sectionOpen=sectionOpen; W.boot=boot;
})();
</script>
<script>
(function(){
"use strict";
var G=window.__WB__;
var t=G.t, esc=G.esc, num=G.num, unmeasured=G.unmeasured, chip=G.chip, tag=G.tag,
    list=G.list, fmtDate=G.fmtDate, STATUS=G.STATUS, VERDICT=G.VERDICT, verdictClass=G.verdictClass;

/* ---------- 5. pieces, with their rounds ---------- */
function fileChips(a){
  if(!a||!a.length) return unmeasured("אין");
  return '<div class="filelist">'+a.map(function(f){return "<span>"+t(f)+"</span>";}).join("")+"</div>";
}
function roundBlock(r){
  var ev=(r.evidence||[]).map(function(e){
    return "<li>"+t(e.path)+(e.note_he?" <span style='color:var(--ink-3)'>"+t(e.note_he)+"</span>":"")+"</li>";
  }).join("");
  var meas=(r.measurements||[]).map(function(m){
    return '<div class="measure"><div class="v">'+num(m.value)+" "+t(m.unit||"")+'</div><div class="k">'+t(m.label_he)+"</div></div>";
  }).join("");
  var verdict=r.verdict==null
    ? chip("waiting",r.verdict_he||"טרם נפסק")
    : chip(verdictClass(r.verdict),r.verdict_he||VERDICT[r.verdict]||r.verdict);
  var gapBody=r.largest_gap_he!=null
    ? t(r.largest_gap_he)
    : unmeasured(r.largest_gap_note_he||"לא ידוע עד שהמבקר ירוץ");
  var refuted=(r.refuted_claims_he&&r.refuted_claims_he.length)
    ? "<dt>טענות שהופרכו</dt><dd><ul class='notelist' style='margin:0'>"+list(r.refuted_claims_he)+"</ul></dd>" : "";

  return '<div class="round">'+
    '<div class="round-h"><b>סבב '+num(r.round)+"</b>"+verdict+
      '<span class="when">'+esc(fmtDate(r.at))+"</span>"+
      (r.critic_document?'<span class="when">'+t(r.critic_document)+"</span>":"")+
    "</div>"+
    '<dl class="kv">'+
      "<dt>מה השתנה</dt><dd>"+t(r.changed_he)+"</dd>"+
      "<dt>המבקר</dt><dd>"+(r.critic_he?t(r.critic_he):unmeasured("טרם רץ"))+"</dd>"+
      "<dt>הפסיקה</dt><dd>"+t(r.verdict_detail_he)+"</dd>"+
      refuted+
      "<dt>ראיות</dt><dd><ul class='notelist' style='margin:0'>"+(ev||"<li>"+unmeasured("אין")+"</li>")+"</ul></dd>"+
      "<dt>הפעולה הבאה</dt><dd>"+t(r.next_action_he)+"</dd>"+
    "</dl>"+
    (meas?'<div class="measures">'+meas+"</div>":"")+
    '<div class="gap"><p class="phase-k">הפער הגדול ביותר שנותר</p><p style="margin:0">'+gapBody+"</p></div>"+
  "</div>";
}
function pieceBlock(S,p){
  var rounds=S.rounds.filter(function(r){return r.piece_id===p.id;});
  var of=p.owner_files||{};
  var creates=(of.creates||[]).map(function(c){return c.path+" ["+c.final_owner+"]";});
  var stories=(p.job_stories||[]).map(tag).join(" ")||unmeasured("אין סיפור ישיר");
  var deps=(p.depends_on||[]).map(tag).join(" ")||unmeasured("אין");
  var decs=(p.blocked_by_decisions||[]).map(tag).join(" ")||unmeasured("אין");
  var ref=p.reference&&p.reference.products&&p.reference.products.length
    ? p.reference.products.map(tag).join(" ")+"<div style='margin-block-start:4px'>"+t(p.reference.take_he)+"</div>"
    : "<div>"+unmeasured("אין מוצר ייחוס")+"<div style='margin-block-start:4px'>"+t(p.reference?p.reference.take_he:"")+"</div></div>";
  var noRounds=p.status==="building"
    ? '<div class="emptybox" style="margin-block-start:var(--s3)"><b>אין סבב סגור.</b>'+
      "החלק בבנייה ועוד לא נשפט. סבב נרשם כאן כשמבקר מדד את הרף וכתב פסיקה, ולא לפני כן.</div>"
    : '<div class="emptybox" style="margin-block-start:var(--s3)"><b>אין סבבים.</b>'+
      "החלק לא נפתח, ולכן אין מה לשנות, אין ראיה למדוד ואין פסיקת מבקר.</div>";
  var roundsHtml=rounds.length?rounds.map(roundBlock).join(""):noRounds;

  var pr=p.progress, prog="";
  if(pr){
    prog='<div class="measures" style="margin:0 0 var(--s4)">'+
      '<div class="measure"><div class="v">'+num(pr.declared_paths_created)+" / "+num(pr.declared_paths_total)+
        '</div><div class="k">נתיבים שהצהיר עליהם, קיימים</div></div>'+
      '<div class="measure"><div class="v">'+num(pr.test_files)+'</div><div class="k">קבצי בדיקה בקידומת שלו</div></div>'+
      '<div class="measure"><div class="v">'+(pr.contract_published?"כן":"לא")+'</div><div class="k">חוזה פרק 8.8 פורסם</div></div>'+
      '<div class="measure"><div class="v">'+unmeasured("טרם נשפט")+'</div><div class="k">הרף</div></div>'+
      "</div>"+
      "<p style='margin:0 0 var(--s4);color:var(--ink-3);font-size:var(--t-micro)'>"+t(pr.method_he)+" נמדד "+
      esc(fmtDate(pr.measured_at))+".</p>";
  }

  return '<details class="piece"><summary>'+
    '<span class="p-id">'+t(p.id)+"</span>"+
    '<span class="p-name">'+t(p.name_he)+'<span class="en">'+t(p.name_en)+"</span></span>"+
    '<span class="p-right">'+
      (rounds.length?tag(rounds.length+" סבבים"):"")+
      ((p.blocked_by_decisions||[]).length?chip("blocked","ממתין להחלטה"):"")+
      chip(p.status,STATUS[p.status]||p.status)+
    "</span></summary>"+
    '<div class="p-body">'+
      "<p style='margin:0 0 var(--s4);color:var(--ink-2)'>"+t(p.purpose_he)+"</p>"+
      prog+
      '<dl class="kv">'+
        "<dt>מצב</dt><dd>"+t(p.status_detail_he)+"</dd>"+
        "<dt>הרף</dt><dd>"+t(p.bar_he)+"<div style='color:var(--ink-3);font-size:var(--t-micro);margin-block-start:3px'>"+t(p.bar_source)+"</div></dd>"+
        "<dt>ייחוס</dt><dd>"+ref+"</dd>"+
        "<dt>רצפת נסיגה</dt><dd>"+t(p.regression_floor_he)+"</dd>"+
        (p.measured_context_he?"<dt>מה נמדד</dt><dd>"+t(p.measured_context_he)+"</dd>":"")+
        "<dt>סיפורים</dt><dd>"+stories+"</dd>"+
        "<dt>תלוי ב</dt><dd>"+deps+"</dd>"+
        "<dt>חסום על</dt><dd>"+decs+"</dd>"+
        "<dt>קבצים בשרת</dt><dd>"+fileChips(of.backend)+
          (of.backend_note_he?"<div style='color:var(--ink-3);font-size:var(--t-micro);margin-block-start:4px'>"+t(of.backend_note_he)+"</div>":"")+"</dd>"+
        "<dt>קבצים בממשק</dt><dd>"+fileChips(of.frontend)+"</dd>"+
        (of.documents?"<dt>מסמכים</dt><dd>"+fileChips(of.documents)+"</dd>":"")+
        "<dt>יוצר ומוסר</dt><dd>"+fileChips(creates)+"</dd>"+
      "</dl>"+
      "<h4 style='font-size:var(--t-small);margin:var(--s5) 0 0;color:var(--ink-3);font-weight:600'>סבבים</h4>"+
      roundsHtml+
    "</div></details>";
}
function sectionPieces(S){
  var waves=[{k:"spec",h:"המפרט, לפני גל 0"},{k:0,h:"גל 0, חמישה חלקים זרים זה לזה"},
             {k:1,h:"גל 1, תשעה חלקים במקביל"},{k:2,h:"גל 2, ארבעה חלקים"}];
  var body=waves.map(function(w){
    var ps=S.pieces.filter(function(p){return p.wave===w.k;});
    if(!ps.length) return "";
    var open=ps.filter(function(p){return p.status!=="waiting";}).length;
    return '<div class="wavehead"><h3>'+t(w.h)+'</h3><span class="meta">'+
      num(open)+" מתוך "+num(ps.length)+" נפתחו</span></div>"+
      ps.map(function(p){return pieceBlock(S,p);}).join("");
  }).join("");
  return '<section id="pieces"><h2><span class="idx">5</span>חלקי הבנייה והסבבים שלהם</h2>'+
    '<p class="sub">לכל חלק פרוסה אנכית של קבצים עם בעלים סופי אחד, רף משלו, מוצר ייחוס אם התדריך נוקב באחד, ושורת רצפה שאומרת מה עובד היום ואסור לו להיעשות גרוע יותר. '+
    "לחצו על חלק כדי לפתוח אותו.</p>"+body+"</section>";
}

/* ---------- 6. evidence ---------- */
function sectionEvidence(S){
  var cards=(S.evidence||[]).map(function(e){
    return '<div class="card pad"><p class="phase-k">'+t(e.group_he)+"</p>"+
      '<p class="stat-v" style="margin:0">'+num(e.count)+' <span style="font-size:var(--t-small);color:var(--ink-3);font-weight:400">'+t(e.count_label_he)+"</span></p>"+
      "<p style='margin:var(--s2) 0 0;font-family:var(--mono);font-size:var(--t-micro);color:var(--ink-2)'>"+t(e.path)+"</p>"+
      "<p style='margin:var(--s3) 0 0;color:var(--ink-2);font-size:var(--t-small)'>"+t(e.detail_he)+"</p></div>";
  }).join("");

  var shots=S.job_stories.filter(function(j){return (j.screenshots||[]).length;});
  var rows=shots.map(function(j){
    return "<tr><td class='id'>"+t(j.id)+"</td><td class='tight'>"+t(j.person_he)+"</td>"+
      "<td>"+j.screenshots.map(function(s){
        var f=s.split("/").pop();
        return "<a href='"+esc(s.replace(/^docs\/ux-gauntlet\//,""))+"'>"+t(f)+"</a>";
      }).join("<span style='color:var(--ink-3)'> · </span>")+"</td>"+
      "<td style='color:var(--ink-3);font-size:var(--t-micro)'>"+t(j.baseline.source)+"</td></tr>";
  }).join("");
  var missing=S.job_stories.length-shots.length;

  return '<section id="evidence"><h2><span class="idx">6</span>מסלול הראיות</h2>'+
    '<p class="sub">כל טענה בדף הזה נשענת על מסמך, על צילום או על מדידה שאפשר להריץ שוב. '+
    "הקישורים יחסיים לתיקיית הגאונטלט ולכן הם נפתחים גם כשהדף נפתח מהדיסק.</p>"+
    '<div class="hero" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'+cards+"</div>"+
    '<div class="tbl" style="margin-block-start:var(--s5)"><table><caption>'+
      "צילומי מדידת הבסיס, לפי סיפור עבודה. "+num(missing)+" מתוך "+num(S.job_stories.length)+
      " הסיפורים נמדדו בלי צילום ייעודי, כי הפסיקה שלהם נשענת על הקוד ועל הנתונים ולא על מסך."+
    "</caption><thead><tr><th>מזהה</th><th>מי</th><th>צילומים</th><th>מקור המדידה</th></tr></thead><tbody>"+
    rows+"</tbody></table></div></section>";
}

/* ---------- 7. deferred ---------- */
function sectionDeferred(S){
  var rows=S.deferred.map(function(d){
    return "<tr><td class='id'>"+t(d.id)+"</td>"+
      "<td class='tight'><b>"+t(d.title_he)+"</b></td>"+
      "<td>"+t(d.reason_he)+"</td>"+
      "<td>"+((d.related_pieces||[]).concat(d.related_stories||[]).map(tag).join(" ")||"<span style='color:var(--ink-3)'>רוחבי</span>")+"</td>"+
      "<td style='color:var(--ink-3);font-size:var(--t-micro)'>"+t(d.source)+"</td></tr>";
  }).join("");
  return '<section id="deferred"><h2><span class="idx">7</span>מה נדחה, ולמה</h2>'+
    '<p class="sub">רשום כאן כדי שמבקר לא ידרג היעדר כפספוס, וכדי שהבעלים יראה מה לא ייבנה בריצה הזאת בלי לחפש. '+
    "לכל שורה סיבה, ולא אחת מהן היא חוסר זמן.</p>"+
    '<div class="tbl"><table><thead><tr><th>מזהה</th><th>מה לא נעשה</th><th>הסיבה</th><th>נוגע ל</th><th>מקור</th></tr></thead><tbody>'+
    rows+"</tbody></table></div></section>";
}

/* ---------- 8. owner decisions ---------- */
function sectionDecisions(S){
  var body=S.decisions.map(function(d){
    return '<details class="piece" open><summary>'+
      '<span class="p-id">'+t(d.id)+"</span>"+
      '<span class="p-name">'+t(d.title_he)+"</span>"+
      '<span class="p-right">'+chip(d.status==="open"?"blocked":"passed",d.status==="open"?"פתוחה":"נענתה")+"</span></summary>"+
      '<div class="p-body">'+
        "<p style='margin:0 0 var(--s4);color:var(--ink-2)'>"+t(d.question_he)+"</p>"+
        '<dl class="kv">'+
          "<dt>מה נמדד</dt><dd><ul class='notelist' style='margin:0'>"+list(d.evidence_he)+"</ul></dd>"+
          "<dt>האפשרויות</dt><dd><ul class='notelist' style='margin:0'>"+list(d.options_he)+"</ul></dd>"+
          "<dt>ההמלצה</dt><dd>"+t(d.recommendation_he)+"</dd>"+
          "<dt>מה נעצר</dt><dd>"+(d.blocks_pieces||[]).map(tag).join(" ")+" "+(d.blocks_stories||[]).map(tag).join(" ")+
            "<div style='margin-block-start:6px'>"+t(d.blocks_note_he)+"</div></dd>"+
          "<dt>התשובה</dt><dd>"+(d.answer!=null?t(d.answer):unmeasured("טרם נענתה"))+"</dd>"+
        "</dl>"+
      "</div></details>";
  }).join("");
  return '<section id="decisions"><h2><span class="idx">8</span>החלטות שממתינות לבעלים</h2>'+
    '<p class="sub">חמש. לכל אחת האפשרויות, מה נמדד, ההמלצה, ומה בדיוק נעצר עד שהיא נענית.</p>'+body+"</section>";
}

/* ---------- footer ---------- */
function footer(S){
  var v=S.campaign.verification||{};
  return '<div class="foot">'+
    "<p>"+t(S.contract_he||S.contract)+"</p>"+
    "<p>עץ הקוד: "+num(S.meta.repo_head_short)+" על הענף "+num(S.meta.branch)+
      ". חבילת הבדיקות: "+num(v.tests_collected)+" נאספות, ומספר העוברות "+unmeasured("לא נמדד")+".</p>"+
    '<div class="srcs">'+S.meta.sources.map(function(s){
      return "<span>"+t(s.path)+"</span>";
    }).join("")+"</div></div>";
}

/* ---------- entry ---------- */
G.render=function(S,src){
  G.renderProv(S,src);
  document.getElementById("app").innerHTML=
    G.sectionNow(S)+G.sectionBlocked(S)+G.sectionStories(S)+G.sectionOpen(S)+
    sectionPieces(S)+sectionEvidence(S)+sectionDeferred(S)+sectionDecisions(S)+footer(S);
  document.title="שולחן העבודה, "+S.campaign.phase.label_he;
};
G.boot();
})();
</script>
</body>
</html>
